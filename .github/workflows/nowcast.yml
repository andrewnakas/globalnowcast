name: Global Nowcast

on:
  schedule:
    - cron: "10 * * * *"   # hourly, ~10 min past (lets the fresh cycle settle)
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "pipeline/**"
      - "site/**"
      - "ml/**"          # shipping trained weights should rebuild the site
      - ".github/workflows/nowcast.yml"
      - "requirements.txt"

concurrency:
  group: nowcast
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # the job fetches from S3; don't burn the 6h default on a hang
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build forecast frames
        # timeout-minutes on the job did not save us: on 2026-08-06 two
        # scheduled builds hung inside a network read and ran 15 min and 2h47m
        # before GitHub reaped them, straight past the 20-minute job limit. A
        # step-level timeout plus SIGKILL bounds the process itself, so a
        # wedged socket costs one build instead of an hour of runner time.
        timeout-minutes: 12
        run: timeout --signal=KILL 10m python pipeline/main.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
